on:
  push:
    branches: [ main ]
    paths:
      - 'dashboard/**' # Only trigger when code inside the dashboard folder changes

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package.json

      - name: Install Dependencies
        run: |
          cd dashboard
          npm install

      - name: Build Project
        run: |
          cd dashboard
          npm run build
        env:
          # Injecting your public Supabase tokens during the build compilation process
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dashboard/dist # Points to the compiled folder Vite generates
          branch: gh-pages # The isolated deployment branch GitHub serves from
