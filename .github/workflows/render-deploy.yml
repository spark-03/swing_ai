name: Deploy to Render

on:
  push:
    branches: [main]
    paths:
      - "paper_trading/**"
      - "requirements.txt"
      - "runtime.txt"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Trigger Render Deploy
        # We check the environment variable instead of the secret context directly
        if: env.RENDER_HOOK != ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_HOOK" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"clearCache": "do_not_clear"}'
        timeout-minutes: 5

      - name: Verify Deployment
        if: env.RENDER_HOOK != ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Render deployment triggered. Check Render dashboard for status."
