name: Live Market PQS Database Sync

on:
  workflow_dispatch: # Allows you to manually trigger it via the Actions tab whenever needed

permissions:
  contents: write # Allows saving updated parquet historical state logs

jobs:
  execute_pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Active Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas pyarrow requests pyotp supabase

    - name: Run Production Data Ingestion & PQS Pipeline
      run: |
        # This will fetch fresh live market ticks, append them, delete the oldest row,
        # calculate technical indicator metrics, evaluate PQS values, and push to Supabase.
        python -m paper_trading.data_ingestion
      env:
        ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
        ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
        ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
        ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PYTHONPATH: .

    - name: Commit and Sync Parquet Lookback Windows
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data/2h/*.parquet
        
        if git diff --staged --quiet; then
          echo "Parquet files are already up-to-date."
        else
          git commit -m "Automated Sync: Updated lookback arrays with latest live candle"
          git push
        fi
